name: CI

on:
  pull_request:
  push:
    branches: [master]

jobs:
  checks:
    # Windows on purpose: the golden PNGs were rendered on Windows, and
    # font rasterisation differs on Linux, so they would fail there.
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.0
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - name: Upload golden diffs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: golden-failures
          path: test/goldens/failures/
          if-no-files-found: ignore
